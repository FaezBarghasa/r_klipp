[workspace]
resolver = "2"
members = [
    "crates/actors",
    "crates/automation",
    "crates/comms",
    "crates/compat-layer",
    "crates/control",
    "crates/hal",
    "crates/io",
    "crates/kinematics",
    "crates/klipper-host",
    "crates/klipper-mcu-firmware",
    "crates/klipper-proto",
    "crates/libs/r_klipp_api",
    "crates/libs/r_klipp_motion",
    "crates/libs/r_klipp_safety",
    "crates/libs/r_klipp_thermal",
    "crates/mcu-drivers",
    "crates/mcu-drivers/driver-drv8825",
    "crates/mcu-drivers/driver-endstop",
    "crates/mcu-drivers/driver-thermistor",
    "crates/mcu-drivers/driver-tmc",
    "crates/motion",
    "crates/motors",
    "crates/parser",
    "crates/safety",
    "crates/sim",
    "crates/thermal",
    "crates/tools",
    "crates/bin/r_klipp_firmware",
    "crates/bin/r_klipp_host",
    "host-server",
    "host-ui",
]

[workspace.dependencies]
embedded-hal = "1.0.0"
embedded-hal-nb = "1.0.0"
embedded-hal-mock = "0.11.1"
nb = "1.1.0"
num-traits = { version = "0.2", default-features = false }
fixed = "1.23.1"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
