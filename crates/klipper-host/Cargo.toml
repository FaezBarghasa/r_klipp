[package]
name = "klipper-host"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-web = "4.15.0"
actix-web-actors = "4.3.1"
anyhow = "1.0.104"
configparser = "3.2.0"
parking_lot = "0.12.5"
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.10.2"
rhai = "1.26.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-serial = "5.5.0"
tracing = "0.1.44"

[dev-dependencies]
actix-rt = "2.12.0"
tracing-subscriber = "0.3.23"
