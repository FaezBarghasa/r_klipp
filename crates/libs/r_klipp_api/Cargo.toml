[package]
name = "r_klipp_api"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
heapless = { version = "0.9.3", default-features = false, features = ["serde"] }
embedded-hal-async = "1.0.0"
fixed = { version = "1.31.0", default-features = false, features = ["serde"] }

[features]
default = ["std"]
std = ["postcard/use-std", "serde/std"]

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "serialization_benchmark"
harness = false
