[package]
name = "motors"
version = "0.1.0"
edition = "2021"

[dependencies]
micromath = "2.1.0"
r_klipp_api = { path = "../libs/r_klipp_api" }
hal = { path = "../hal" }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-sync = "0.8.0"
[target.'cfg(target_arch = "arm")'.dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-interrupt",
] }

[target.'cfg(not(target_arch = "arm"))'.dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-std",
    "executor-thread",
] }
embedded-hal-async = "1.0.0"

[features]
default = []
std = []
