[package]
name = "klipper-mcu-firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.6.0"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32f407vg",
    "time-driver-tim5",
    "exti",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
fixed = "1.31.0"
futures = { version = "0.3.34", default-features = false }
heapless = "0.8.0"
libm = "0.2.16"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rtic = { version = "2.3.1", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.2.1", features = ["cortex-m-systick"] }
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f407"] }
stm32-metapac = { version = "21.0.0", features = ["stm32f407vg", "rt"] }
mcu-drivers = { path = "../mcu-drivers" }

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-interrupt",
] }

[target.'cfg(not(target_arch = "arm"))'.dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-std",
    "executor-thread",
] }

[features]
default = ["embassy-rt", "defmt"]
embassy-rt = []
defmt = []
