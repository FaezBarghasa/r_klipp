[package]
name = "motion"
version = "0.1.0"
edition = "2024"

[dependencies]
mcu-drivers = { path = "../mcu-drivers" }
heapless = "0.8"
nalgebra = "0.33"
smallvec = "1.11"
rustfft = "6.1"
libm = "0.2"
micromath = "2.1.0"

[dev-dependencies]
float-cmp = "0.10"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false