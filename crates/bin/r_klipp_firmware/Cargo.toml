[package]
name = "r_klipp_firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
r_klipp_api = { path = "../../libs/r_klipp_api" }
r_klipp_motion = { path = "../../libs/r_klipp_motion" }
r_klipp_safety = { path = "../../libs/r_klipp_safety" }
[target.'cfg(target_arch = "arm")'.dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-interrupt",
] }
embassy-stm32 = { version = "0.6.0", features = [
    "stm32f407vg",
    "memory-x",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
defmt = "1.1.1"
defmt-rtt = "1.3.0"
cortex-m = { version = "0.7.9", features = ["inline-asm"] }
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
heapless = "0.9.3"
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
libm = "0.2.16"
micromath = "2.1.0"

[target.'cfg(not(target_arch = "arm"))'.dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-std",
    "executor-thread",
] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

[dependencies.embassy-sync]
version = "0.8.0"
features = ["defmt"]
