[package]
name = "r_klipp_host"
version = "0.1.0"
edition = "2024"

[dependencies]
r_klipp_api = { path = "../../libs/r_klipp_api" }
r_klipp_motion = { path = "../../libs/r_klipp_motion", features = ["std"] }
tokio = { version = "1.53.1", features = ["full"] }
actix-web = "4.15.0"
tokio-serial = "5.5.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
nalgebra = "0.35.0"
dioxus = { version = "0.7.10", features = ["fullstack"] }
futures-util = "0.3.34"
heapless = "0.9.3"

[dev-dependencies]
criterion = "0.8.2"
