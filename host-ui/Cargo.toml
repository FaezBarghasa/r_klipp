[package]
name = "host-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "backend-winit",
] }
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
url = "2.5.8"

[build-dependencies]
slint-build = "1.17.1"
