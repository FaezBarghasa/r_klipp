[package]
name = "host-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.5", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "backend-winit",
] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3"
url = "2"

[build-dependencies]
slint-build = "1.5"
