# ==============================================================================
# MKS SKIPR + MKS PI_TS35 Hardware Configuration Profile for r_klipp
# ==============================================================================
# Microcontroller: STM32F407VET6 (ARM Cortex-M4F @ 168MHz)
# Host SBC: MKS SKIPR Compute Module (Quad-Core ARM Cortex-A53 Linux)
# Display: MKS PI_TS35 3.5-inch Touchscreen (480x320 DSI/SPI Panel)
# ==============================================================================

[mcu]
serial: /dev/ttyUSB0
restart_method: command
baud: 115200
board: mks_skipr
architecture: stm32f407

[printer]
kinematics: cartesian
max_velocity: 300.0
max_accel: 3000.0
max_z_velocity: 15.0
max_z_accel: 100.0

# ------------------------------------------------------------------------------
# Stepper Motors (TMC2209 / TMC2240)
# ------------------------------------------------------------------------------

[stepper_x]
step_pin: PA14
dir_pin: PA13
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA0
position_endstop: 0
position_max: 250
homing_speed: 50.0

[stepper_y]
step_pin: PE10
dir_pin: PE9
enable_pin: !PE11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA1
position_endstop: 0
position_max: 250
homing_speed: 50.0

[stepper_z]
step_pin: PE14
dir_pin: PE13
enable_pin: !PE15
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA2
position_endstop: 0
position_max: 250
homing_speed: 10.0

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5
microsteps: 16
rotation_distance: 22.67895
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB11
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA2
min_temp: 0
max_temp: 300
control: pid
pid_kp: 21.527
pid_ki: 1.063
pid_kd: 108.982

# ------------------------------------------------------------------------------
# Heated Bed & Thermal Control
# ------------------------------------------------------------------------------

[heater_bed]
heater_pin: PB10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
min_temp: 0
max_temp: 130
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182

# ------------------------------------------------------------------------------
# Cooling Fans
# ------------------------------------------------------------------------------

[fan]
pin: PB15 # Part cooling fan

[heater_fan hotend_fan]
pin: PB14 # Hotend extruder cooling fan
heater: extruder
heater_temp: 50.0

# ------------------------------------------------------------------------------
# MKS PI_TS35 3.5-inch Touchscreen Display Configuration
# ------------------------------------------------------------------------------

[display]
type: mks_pi_ts35
resolution_width: 480
resolution_height: 320
color_depth: 24
interface: dsi
touch_driver: goodix_gt911 # or xpt2046
orientation: landscape
renderer: slint_software
slint_backend: software
