[package]
name = "host-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
actix-cors = "0.7.2"
actix-ws = "0.4.0"
actix-multipart = "0.8.1"
tokio = { version = "1.53.1", features = ["full"] }
surrealdb = { version = "2.2.1", features = ["kv-surrealkv"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.20"
futures-util = "0.3.34"
tokio-serial = "5.5.0"
postcard = { version = "1.1.3", features = ["alloc"] }
cobs = "0.5.1"
lazy_static = "1.5.0"
env_logger = "0.11.11"
log = "0.4.34"
async-trait = "0.1.92"
mime = "0.3.17"
uuid = { version = "1.25.0", features = ["v4", "serde"] } # For file uploads
tokio-util = { version = "0.7.19", features = [
    "codec",
] } # For framed reads/writes on serial
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] } # For timestamps in models
dashmap = "6.2.1"
minijinja = { version = "2.24.0", features = ["loader", "json"] }
regex = "1.13.1"
memmap2 = "0.9.11"
hostname = "0.4.2"
urlencoding = "2.1.3"
clap = { workspace = true }
host-ui = { path = "../host-ui" }
