[env]
PKG_CONFIG_PATH = { value = "target/pkgconfig", relative = true }

[build]
rustflags = ["-L", "native=target/pkgconfig"]

[target.thumbv7em-none-eabihf]
runner = "qemu-system-arm -machine olimex-stm32-h405 -nographic -semihosting-config enable=on,target=native -kernel"
rustflags = ["-C", "link-arg=-Tlink.x"]

[target.thumbv7m-none-eabi]
runner = "qemu-system-arm -machine olimex-stm32-h405 -nographic -semihosting-config enable=on,target=native -kernel"
rustflags = ["-C", "link-arg=-Tlink.x"]

[alias]
lint = "clippy --workspace --exclude klipper-mcu-firmware --exclude r_klipp_firmware -- -D warnings"
lint-mcu = "clippy -p klipper-mcu-firmware -p mcu-drivers --target thumbv7em-none-eabihf --features embassy-rt -- -D warnings"
fmt-check = "fmt --all -- --check"
deny-check = "deny check"
test-core = "test -p parser -p motion -p thermal -p safety -p kinematics -p comms -p klipper-proto -p sim -p compat-layer -p r_klipp_api"
